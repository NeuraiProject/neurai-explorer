# Container logs are capped so they cannot grow unbounded on disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. Neurai Node (published image from Docker Hub; nothing is built locally)
  node:
    image: neuraiproject/neurai-node:${NEURAI_IMAGE_TAG:-v1.0.6}
    container_name: neurai-explorer-node
    restart: unless-stopped
    # neuraid needs time to flush its databases on shutdown; killing it early
    # can force a long reindex on the next start.
    stop_grace_period: 5m
    environment:
      # These are written to /data/neurai.conf on the first start of an empty
      # volume only. To change an existing node, edit that file and restart.
      NEURAI_RPC_USER: ${RPC_USER:-neuraiuser}
      NEURAI_RPC_PASSWORD: ${RPC_PASS:-neuraipassword}
      # RPC is only reachable inside neurai-explorer-net; the port is not
      # published to the host.
      NEURAI_RPC_BIND: 0.0.0.0
      NEURAI_RPC_ALLOW_IP: 0.0.0.0/0
      NEURAI_RPC_WORK_QUEUE: ${RPC_WORKQUEUE:-1024}
      NEURAI_RPC_THREADS: ${RPC_THREADS:-64}
      NEURAI_LISTEN: 0
      NEURAI_DISABLE_WALLET: 1
      # Full indexes required by the syncer.
      NEURAI_TXINDEX: 1
      NEURAI_ASSETINDEX: 1
      NEURAI_ADDRESSINDEX: 1
      NEURAI_TIMESTAMPINDEX: 1
      NEURAI_SPENTINDEX: 1
      NEURAI_REST: 1
      NEURAI_DB_CACHE: ${NODE_DB_CACHE:-128}
      NEURAI_EXTRA_CONF: "rpcservertimeout=240"
    volumes:
      - node-data:/data
    networks:
      - neurai-explorer-net
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Reports unhealthy while the RPC server is down or still warming up, e.g.
    # during a reindex; it does not restart the container.
    healthcheck:
      test: ["CMD", "neurai-cli", "-datadir=/data", "getblockchaininfo"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 10m

  # 2. PostgreSQL Database
  postgres:
    image: postgres:18.1-alpine
    container_name: neurai-explorer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurai123}
      POSTGRES_DB: ${POSTGRES_DB:-neuraidb}
    # The stock image is tuned for tiny machines (128MB shared_buffers, 1GB
    # max_wal_size). During the initial sync the syncer bulk-loads millions of
    # rows into tables with several random-key indexes; what limits it is
    # write I/O, mostly full-page images written to the WAL after every
    # checkpoint. A larger buffer pool and far less frequent checkpoints
    # (bigger max_wal_size / checkpoint_timeout) cut that several-fold. Set
    # PG_SHARED_BUFFERS to ~25% of the RAM you can give PostgreSQL and
    # PG_MAX_WAL_SIZE to what the disk can spare (it is reclaimed later).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-8GB}
      - -c
      - checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=lz4
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # postgres:18 images keep the cluster in /var/lib/postgresql/18/docker
      # (PGDATA) and declare /var/lib/postgresql as the volume; mounting the
      # pre-18 path /var/lib/postgresql/data would leave the data in an
      # anonymous volume that is lost on `docker compose down`.
      - pg-data:/var/lib/postgresql
    networks:
      - neurai-explorer-net
    logging: *default-logging

  # 3. Syncer Service (Rust)
  syncer:
    image: neurai-explorer-syncer:latest
    build:
      context: ./syncer
      dockerfile: Dockerfile
    container_name: neurai-explorer-syncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_started
    environment:
      RPC_HOST: node
      RPC_PORT: 19001
      RPC_USER: ${RPC_USER:-neuraiuser}
      RPC_PASS: ${RPC_PASS:-neuraipassword}
      DATABASE_URL: postgresql://${POSTGRES_USER:-neurai}:${POSTGRES_PASSWORD:-neurai123}@postgres:5432/${POSTGRES_DB:-neuraidb}
      RUST_LOG: info,sqlx=warn,reqwest=warn
      # Blocks and previous transactions are fetched through the node's REST
      # interface (NEURAI_REST=1 above), which parallelises much better than
      # the getblock/getrawtransaction RPCs. Set to 0 to force RPC only.
      RPC_USE_REST: ${RPC_USE_REST:-1}
      # Set to 1 (once) to let a new syncer version wipe data written with an
      # older schema and resync from genesis. Otherwise it stops and says so.
      RESYNC_ON_SCHEMA_CHANGE: ${RESYNC_ON_SCHEMA_CHANGE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - neurai-explorer-net
    logging: *default-logging
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 2G

  # 4. Frontend (Next.js) + Tailwind CSS
  frontend:
    image: neurai-explorer-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurai-explorer-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3333}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neurai}:${POSTGRES_PASSWORD:-neurai123}@postgres:5432/${POSTGRES_DB:-neuraidb}
      NEURAI_RPC_URL: http://node:19001
      NEURAI_RPC_USER: ${RPC_USER:-neuraiuser}
      NEURAI_RPC_PASSWORD: ${RPC_PASS:-neuraipassword}
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - neurai-explorer-net
    logging: *default-logging

networks:
  neurai-explorer-net:
    driver: bridge

volumes:
  node-data:
  pg-data:
